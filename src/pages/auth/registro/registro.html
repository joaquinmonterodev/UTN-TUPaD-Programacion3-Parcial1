<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/pages/auth/login/login.css">
    <title>Registro - Food Store</title>
</head>
<body>
    <h1>Registro</h1>
    <form id="form">
        <div class="form-campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com" required>
        </div>
        <div class="form-campo">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
        </div>
        <div id="tyc">
            <label for="tyc">Acepto términos y condiciones.</label>
            <input type="checkbox" name="tyc" id="tyc-input" required>
        </div>
        <button class="buscador__btn" type="submit">Crear usuario</button>
        <a class="form-anchor" href="/src/pages/auth/login/login.html">Ya tengo cuenta</a>
    </form>
    <script type="module" src="./registro.ts"></script>
</body>
</html>
